<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A paperclip.

       The control lists the notes and attachments on a record, and the clip is
       the one shape that says "attachment" without a card under it. A list of
       rows would have said "list", which is what half the dataset controls in
       this account already say.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px, and the tilt is the whole reason it reads. Upright, the
       three arcs stack into concentric ovals and the mark becomes a padlock or
       a zero with a tail; at 32 it was unreadable. Rotated 28 degrees the arms
       separate along the diagonal and the clip is legible down to 24.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="attachment-list-ramp" x1="4" y1="80" x2="92" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- One stroke, three turns, tilted. -->
  <g transform="rotate(28 48 48)">
    <path d="M62 38 L62 62 A11 11 0 0 1 40 62 L40 30 A14 14 0 0 1 68 30 L68 66 A19 19 0 0 1 30 66 L30 42"
          stroke="url(#attachment-list-ramp)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
</svg>
